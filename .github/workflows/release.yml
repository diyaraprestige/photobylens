name: Release (Android APK + browser extension)

# Runs when the version in package.json changes on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PBL_API_BASE: ${{ vars.PBL_API_BASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # Exact versions from package-lock.json; install scripts are blocked.
      - name: Install tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web, app and extension
        run: |
          node scripts/build.mjs app
          node scripts/build.mjs ext
          node scripts/build.mjs pages

      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#121331' --iconBackgroundColorDark '#121331' --splashBackgroundColor '#eef0fa' --splashBackgroundColorDark '#121331' --assetPath resources || echo "Icon generation skipped"
          # Privacy: keep app data (saved Gemini key, photos) out of Android cloud and USB backups.
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build release APK (not debuggable)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package extension and website
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/unsigned.apk
          (cd dist/extension && zip -qr ../../out/Photobylens-extension.zip .)
          (cd dist/pages && zip -qr ../../out/Photobylens-web.zip .)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: out/
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
          path: out

      # The signing key is only ever available inside this step. No third-party code runs here.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in Settings > Secrets and variables > Actions. No release was published."
            exit 1
          fi
          umask 077
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 out/unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --key-pass env:KS_PASS --out out/Photobylens.apk out/aligned.apk
          rm -f "$RUNNER_TEMP/release.jks" out/unsigned.apk out/aligned.apk out/*.idsig
          "$BT/apksigner" verify --print-certs out/Photobylens.apk | grep -v -i "digest" || true

      - name: Pick release tag
        id: tag
        run: echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Photobylens ${{ steps.tag.outputs.name }}
          make_latest: true
          body: |
            ## Download
            - **Android:** `Photobylens.apk`. Open it on your phone and allow "Install unknown apps" for your browser when asked.
            - **Chrome / Edge / Brave:** `Photobylens-extension.zip`. Unzip it, open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and choose the unzipped folder.
            - **Website files:** `Photobylens-web.zip` (for self-hosting).

            Photos stay on your device. AI retouch runs on your own free Gemini key.
          files: |
            out/Photobylens.apk
            out/Photobylens-extension.zip
            out/Photobylens-web.zip
